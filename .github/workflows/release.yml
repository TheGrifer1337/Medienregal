name: Windows-Release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: medienregal-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Installer bauen
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          go vet ./...
          go test ./...
          bash build.sh "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/Medienregal-Setup-v*.exe
          if-no-files-found: error
  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup
      - name: Installation und Programmfenster prüfen
        shell: pwsh
        run: |
          $setup = (Get-ChildItem 'Medienregal-Setup-v*.exe' | Select-Object -First 1).FullName
          $folder = Join-Path $env:RUNNER_TEMP 'Medatheke Windows Test'
          $program = Join-Path $folder 'Medienregal.exe'
          $uninstaller = Join-Path $folder 'Medienregal-Deinstallieren.exe'
          $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Medienregal'
          function Invoke-Setup([string[]]$Arguments) {
            $process = Start-Process $setup -ArgumentList $Arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Setup exit code $($process.ExitCode)" }
          }
          Invoke-Setup @('/S', "/D=$folder")
          if ((Get-ItemProperty $entry).DisplayName -ne 'Medatheke by Maximilian') { throw 'Uninstall entry missing' }
          if ((Get-Item $program).VersionInfo.FileDescription -ne 'Medatheke by Maximilian') { throw 'Program name missing' }
          $app = Start-Process $program -PassThru
          try {
            $found = $false
            foreach ($attempt in 1..40) {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
              if ($app.HasExited) { throw "Desktop app exited with code $($app.ExitCode)" }
              $views = Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe' AND ParentProcessId = $($app.Id)"
              if ($app.MainWindowTitle -eq 'Medatheke by Maximilian' -and $views) { $found = $true; break }
            }
            if (-not $found) { throw 'Native window with embedded WebView2 missing' }
          } finally {
            if (-not $app.HasExited) {
              [void]$app.CloseMainWindow()
              if (-not $app.WaitForExit(10000)) { Stop-Process -Id $app.Id -Force }
            }
          }
          Invoke-Setup @('/S', '/UPDATE', "/D=$folder")
          $removal = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
          foreach ($attempt in 1..16) {
            if (-not (Test-Path $program)) { break }
            Start-Sleep -Milliseconds 500
          }
          if ((Test-Path $program) -or (Test-Path $entry)) { throw 'Uninstallation incomplete' }
  publish:
    needs: test-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: dist
      - name: Neue Version veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(<VERSION)
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag ist bereits veröffentlicht."
            exit 0
          fi
          current="${version/./}"
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          highest=9
          while IFS= read -r published; do
            if [[ "$published" =~ ^v(0|[1-9][0-9]*)\.[0-9]$ ]]; then
              numeric="${published:1}"
              numeric="${numeric/./}"
              if (( numeric > highest )); then highest=$numeric; fi
            fi
          done <<< "$releases"
          if (( current != highest + 1 )); then
            echo "Die Versionsnummer muss direkt auf den letzten Release folgen."
            exit 1
          fi
          gh release create "$tag" "dist/Medienregal-Setup-$tag.exe" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Medatheke by Maximilian $version" --generate-notes
