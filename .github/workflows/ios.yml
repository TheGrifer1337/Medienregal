name: iPhone Build
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: SwiftUI-App für den iPhone-Simulator bauen
        run: |
          xcodebuild -project ios/Mediathek/Mediathek.xcodeproj -scheme Mediathek \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: Mediathek-iPhone-Simulator
          path: ios-build/Build/Products/Debug-iphonesimulator/Mediathek.app
          if-no-files-found: error
