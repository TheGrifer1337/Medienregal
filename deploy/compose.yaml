services:
  mediathek:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - accounts:/accounts
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MEDIATHEK_DOMAIN: "${MEDIATHEK_DOMAIN:?Set MEDIATHEK_DOMAIN to your DNS hostname}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - mediathek
volumes:
  accounts:
  caddy-data:
