<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14131b"><title>Mediathek by Maximilian</title><link rel="icon" href="bookshelf.png"><link rel="stylesheet" href="style.css"><script src="locale.js" defer></script><script src="media-extras.js" defer></script><script src="history.js" defer></script><script src="providers.js" defer></script><script src="collection.js" defer></script><script src="enrich.js" defer></script><script src="rankings.js" defer></script><script src="covers.js" defer></script><script src="launchers.js" defer></script><script src="app.js" defer></script></head>
<body data-category="movie">
<header class="top"><div class="top-inner"><div class="brand"><img src="bookshelf.png" width="42" height="42" alt=""><div>Mediathek<span>by Maximilian</span></div></div><nav class="tabs" aria-label="Medienart" data-label="Medienart" id="tabs"></nav><div class="top-actions"><button class="quiet" id="settings" lang="en">Settings</button><button class="quiet" id="exit" data-copy="Beenden">Beenden</button></div></div></header>
<main><p id="notice" role="status"></p><div id="collection-panel">
 <section class="heading" aria-labelledby="heading">
  <div class="hero-art" aria-hidden="true"><div class="scene movie-scene"></div><div class="scene series-scene"></div><div class="scene book-scene"></div></div>
  <div class="hero-content"><h1 id="heading">Filme</h1><p id="count"></p><button class="accent" id="add" data-copy="＋ Titel hinzufügen">＋ Titel hinzufügen</button> <button class="quiet" id="launcher-import" data-copy="Installierte Spiele importieren" hidden>Installierte Spiele importieren</button></div>
 </section>
 <div class="collection-tools">
  <div class="selects"><div id="lists-filter" role="group" aria-label="Eigene Listen" data-label="Eigene Listen"></div><button class="quiet" id="new-list" data-copy="Neue Liste">Neue Liste</button></div>
  <div class="selects"><button class="quiet" id="favorites-filter" data-copy="♥ Favoriten" aria-pressed="false">♥ Favoriten</button><button class="quiet" id="series-overview" data-copy="Reihen und Universen">Reihen und Universen</button><button class="quiet" id="loan-overview" data-copy="Verliehene Medien">Verliehene Medien</button><button class="quiet" id="duplicates" data-copy="Duplikate">Duplikate</button><button class="quiet" id="undo-collection" data-copy="Rückgängig">Rückgängig</button><select aria-label="Ansicht" data-label="Ansicht" id="view"><option value="large" data-copy="Große Icons">Große Icons</option><option value="small" data-copy="Kleine Icons">Kleine Icons</option><option value="list" data-copy="Liste">Liste</option></select></div>
 </div>
 <div class="toolbar">
  <div class="filters" id="status-filters" aria-label="Statusfilter" data-label="Statusfilter"></div>
  <div class="selects"><label id="provider-filter" hidden><input type="checkbox" id="only-providers"> <span data-copy="Nur bei meinen Anbietern">Nur bei meinen Anbietern</span></label><label id="subscription-filter" hidden><input type="checkbox" id="only-subscriptions"> <span data-copy="In meinem Abo enthalten">In meinem Abo enthalten</span></label><select aria-label="Genre" data-label="Genre" id="genre"></select><select aria-label="Sortierung" data-label="Sortierung" id="sort"><option value="title" data-copy="Titel A–Z">Titel A–Z</option><option value="best" data-copy="Bewertung ↓">Bewertung ↓</option><option value="worst" data-copy="Bewertung ↑">Bewertung ↑</option><option value="genre" data-copy="Genre A–Z">Genre A–Z</option></select></div>
 </div>
 <section class="shelf" id="shelf" aria-label="Gespeicherte Titel" data-label="Gespeicherte Titel"></section>
 </div>
 <section id="statistics" aria-label="Statistik" data-label="Statistik" hidden></section>
</main>
<aside id="annual-chart" class="annual-chart" aria-label="Jahresrangliste" data-label="Jahresrangliste">
 <div class="chart-heading"><h2 id="chart-title">Top 50</h2><p id="chart-source"></p><select id="chart-genre" aria-label="Chart-Genre" data-label="Chart-Genre"><option value="" data-copy="Alle Genres">Alle Genres</option></select><button id="chart-pause" data-copy="Pausieren" type="button" class="quiet">Pausieren</button></div>
 <div id="chart-frame" class="chart-frame"><div id="chart-track" class="chart-track"></div></div>
</aside>
<dialog id="modal"><div id="modal-body"></div></dialog>
</body></html>
